<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reflection Emailer</title>
  <!-- EmailJS SDK -->
  <script src="https://cdn.emailjs.com/sdk/3.11.0/email.min.js" defer></script>
  <script defer>
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof emailjs === 'undefined') {
        document.body.innerHTML += "<div style='color:red;'>EmailJS SDK failed to load. Check your network or try reloading.</div>";
        return;
      }
      emailjs.init("xbrRnblqLJkUZOa-y");

      document.getElementById('reflection-form').addEventListener('submit', function(event) {
        event.preventDefault();

        const serviceID = 'service_nyv0e7q';
        const templateID = 'template_n8xvr3h';

        emailjs.sendForm(serviceID, templateID, this)
          .then(() => {
            document.getElementById('result-message').innerHTML = "Reflection sent! Please check your inbox.";
            document.getElementById('reflection-form').reset();
          }, (err) => {
            document.getElementById('result-message').innerHTML = "Failed to send reflection. Please try again.";
          });
      });
    });
  </script>
</head>
<body>
  <form id="reflection-form">
    <textarea id="reflection" name="reflection" placeholder="Type your reflection..." rows="8" style="width:100%"></textarea>
    <br>
    <input type="email" id="user_email" name="user_email" placeholder="Your email" required />
    <br>
    <button type="submit">Email my reflection</button>
  </form>
  <div id="result-message"></div>
</body>
</html>
